# seriesd.conf - one place for every Series D setting. Sourced by dockerimg.sh (and by the D test scripts).
# Everything here can be overridden from the environment.

# ---------------- image ----------------
: "${IMAGE_NAME:=hpl-bench}"
: "${IMAGE_TAG:=v1}"
: "${BASE_IMAGE:=ubuntu:26.04}"             # same Ubuntu release as the nodes
: "${REGISTRY:=192.168.10.1:5000}"          # local registry on the head (D5 pull time)
: "${OPENBLAS_THREADS:=64}"                 # NUM_THREADS used when OpenBLAS is built; match the bare-metal build
: "${SRC_DIR:=/apps/src}"                   # where the source tarballs are (or set OMPI_TAR, OPENBLAS_TAR, HPL_TAR, OSU_TAR)
: "${CTX:=/data/docker/context}"            # build context (staged sources)

# ---------------- containers ----------------
: "${CONT:=hplbox}"                         # container name on every node
: "${SSH_PORT:=2222}"                       # sshd inside the containers (host sshd stays on 22)
: "${KEYDIR:=/data/docker/ssh}"             # ssh keys for the containers, owned by clusteruser, on the shared /data
: "${CLUSTER_UID:=2001}"
# host networking and host IPC as the plan says; SYS_PTRACE lets the shared-memory transport use single-copy (CMA).
# The container runs as clusteruser, so files written to the bind mount are owned by 2001 like everything else.
: "${RUN_FLAGS:=--network host --ipc host --cap-add SYS_PTRACE --user $CLUSTER_UID:$CLUSTER_UID}"
: "${MOUNTS:=-v /data:/data}"               # results, logs, hostfile. Do NOT mount /apps: the image has its own copy.
# identical to the bare-metal flags (the plan's "same MPI launch"); the only addition is the ssh agent, set through the environment
: "${MPI_FLAGS:=--prefix /apps/openmpi --mca btl_tcp_if_include 192.168.10.0/24 --mca oob_tcp_if_include 192.168.10.0/24}"
: "${HOSTFILE:=$HOME/hostfile}"

# ---------------- Series D test parameters ----------------
: "${D_PAIRS:=8}"                           # interleaved bare/docker pairs (plan: at least 8, 5 can never reach p < 0.05)
: "${D_REST:=30}"                           # seconds between runs; every run starts from a cool idle machine (CPU within ~5 C of idle)
# D1: single-node HPL, bare versus Docker: the head and two laptops, at the fixed N and at each node's maximum N
: "${D1_NODES:=gameserver node01 node02}"   # CHOOSE the two laptops (one per CPU generation is a good spread)
: "${D1_N_FIX:=16000}"                      # fits the 4 GB machine, same as C2
: "${D1_N_MAX:=auto}"                       # auto = memory-limited N from the Section 11 formula (the C-series function)
: "${D1_RANK_POLICY:=cores}"                # one rank per physical core, OPENBLAS_NUM_THREADS=1, --bind-to core
# NB, P x Q, BCAST and depth: the frozen values chosen in C4, read from the same state file the C scripts use
: "${TUNED_STATE:=/data/cluster_logs/state.env}"
# D2: other workloads, same paired design
: "${D2_SYSBENCH_CPU_TIME:=30}"             # sysbench cpu --cpu-max-prime=20000 --threads=1 and --threads=<cores>
: "${D2_SYSBENCH_MEM:=20G}"                 # sysbench memory --memory-block-size=1M, 1 thread and all threads
: "${D2_FILEIO_SIZE:=2G}"                   # fileio rndrw, --file-extra-flags=direct, on: bind mount, container filesystem, host local disk
: "${D2_FILEIO_TIME:=60}"
# D3: multi-node containerized HPL against the bare-metal C2 and C3 numbers (same config names as clusterbench.sh)
: "${D3_CONFIGS:=w2 w3 w5 h5}"              # 2 workers, 3 workers, all workers, head + all workers
: "${D3_NETWORKS:=host}"                    # bridge is NOT wired in yet: see notes (MPI across NAT needs extra design)
# D4: network inside containers, between two nodes
: "${D4_IPERF_SECONDS:=60}"                 # iperf3 with 1 and 4 streams, both directions
: "${D4_OSU:=osu_latency osu_bw}"           # latency at 8 bytes, bandwidth at 1 MB are the headline values
# D5: deployment cost, recorded by dockerimg.sh itself: image size, build time, push time, pull time per node
