network:
  version: 2
  renderer: networkd
  ethernets:
    # Primary Home Interface (Management & Internet)
    enp3s0:
      dhcp4: no
      addresses:
        - 192.168.1.24/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

    # Cluster Intranet Gateway (Connected to 8-port Switch)
    enp4s0:
      dhcp4: no
      addresses:
        - 192.168.10.1/24
