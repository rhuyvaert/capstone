# Strict interface isolation for the enp4s0 secondary network card for cluster

interface=enp4s0
bind-interfaces

# Cluster subnet DHCP (192.168.10.0/24)
# Pool of temporary ip leases for PXE boot (x.x.x.50 to x.x.x.99)
dhcp-range=192.168.10.50,192.168.10.99,255.255.255.0,24h

# Network router information to push to worker nodes
dhcp-option=3,192.168.10.1
dhcp-option=6,192.168.10.1

# TFTP and UEFI PXE boot
enable-tftp
tftp-root=/srv/tftp

dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9

# Boot filenames by architecture
dhcp-boot=tag:bios,pxelinux.0
dhcp-boot=tag:efi-x86_64,bootx64.efi
# fallback
dhcp-boot=bootx64.efi
