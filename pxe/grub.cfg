set default=0
set timeout=5

menuentry "Autoinstall Ubuntu Server to Cluster Node" {
    set root=(tftp,192.168.10.1)
    linux /ubuntu/vmlinuz ip=dhcp netboot=nfs nfsroot=192.168.10.1:/srv/nfs/ubuntu-iso autoinstall ds=nocloud-net\;s=http://192.168.10.1:8085/autoinstall ---
    initrd /ubuntu/initrd
}
